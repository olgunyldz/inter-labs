id: T03
name: Gateway API ile giriş (ingress-nginx'in yerine geçme)
category: trafik
purpose: >
  ingress-nginx Mart 2026'da emekliye ayrıldı. Mesh'in kendi Gateway API uygulamasının küme girişini
  (north-south) üstlenip üstlenemeyeceğini göstermek: ayrı bir ingress ürününe gerek kalır mı?
method: >
  shop namespace'inde Gateway (gatewayClassName: istio) + HTTPRoute ile gateway servisi yayınlanır;
  mesh dışı bir pod'dan erişilir ve zincirin tamamının çalıştığı doğrulanır. Linkerd'de giriş için
  Gateway API uygulaması yoktur (yalnızca mesh içi GAMMA); ayrı bir ürün gerekir.
components: [Gateway API v1.6, Istio gateway (Envoy), HTTPRoute]
meshes: [istio-sidecar, istio-ambient, istio-ambient-l7, linkerd]
outputs: [gateway_programmed, route_accepted, chain_ok, p50_ms]
pass_criteria: Gateway hazır, route kabul edildi, zincir mesh dışından erişilebilir
