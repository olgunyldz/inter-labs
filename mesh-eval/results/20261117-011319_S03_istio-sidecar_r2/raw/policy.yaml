apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: allow-nothing, namespace: shop }
spec: {}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: allow-gateway, namespace: shop }
spec:
  selector: { matchLabels: { app: gateway } }
  action: ALLOW
  rules: [{ from: [{ source: { principals: ["cluster.local/ns/loadgen/sa/k6","cluster.local/ns/ingress-nginx/sa/ingress-nginx","cluster.local/ns/shop/sa/gateway"] } }] }]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: allow-order, namespace: shop }
spec:
  selector: { matchLabels: { app: order } }
  action: ALLOW
  rules: [{ from: [{ source: { principals: ["cluster.local/ns/shop/sa/gateway"] } }] }]
---
apiVersion: security.istio.io/v1
