id: P03
name: Ani yük (spike) — dayanım ve toparlanma
category: performans
purpose: Ani trafik sıçramasında hata oranını ve sistemin normale dönme süresini ölçmek.
method: >
  Üç aşama: düşük yük (100 RPS) -> ani sıçrama -> tekrar düşük yük. Sıçrama ve sonrası p99/hata
  ölçülür; toparlanma süresi, sıçrama bittikten sonra p99'un tekrar ilk aşamanın 2 katının
  altına indiği ana kadar geçen süredir (k6 canlı metrikleri, 5 sn çözünürlük).
components: [k6, chainsvc zinciri, Prometheus]
meshes: [all]
profiles:
  quick: "100 -> 700 (20 sn) -> 100 RPS"
  full: "100 -> 1200 (30 sn) -> 100 RPS"
outputs: [before.p99_ms, spike.p99_ms, spike.error_rate, after.p99_ms, recovery_s]
pass_criteria: Sıçrama sonrası aşamada hata oranı < %1
