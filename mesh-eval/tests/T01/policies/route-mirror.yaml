apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: catalog-canary, namespace: shop }
spec:
  parentRefs: [{ group: "", kind: Service, name: catalog, port: 9090 }]
  rules:
    - filters: [{ type: RequestMirror, requestMirror: { backendRef: { name: catalog-v2, port: 9090 } } }]
      backendRefs: [{ name: catalog-v1, port: 9090 }]
