id: R02
name: Hata enjeksiyonu (fault injection)
category: dayanıklılık
purpose: >
  Uygulama koduna dokunmadan, mesh üzerinden kontrollü hata ve gecikme enjekte edebilmek
  (kaos testi, dayanıklılık tatbikatı). Mesh'lerin bu yeteneğini ve doğruluğunu kıyaslamak.
method: >
  catalog'a giden isteklerin %10'una 503, %10'una 200 ms gecikme enjekte edilir; 100 RPS yükte gateway'de
  gözlenen hata oranı ve gecikme dağılımı ölçülür. Istio: VirtualService fault. Linkerd'de yerleşik hata
  enjeksiyonu yoktur; önerilen yöntemle (HTTPRoute ağırlıklı yönlendirme ile hatalı / yavaş backend) yapılır.
components: [Istio VirtualService (sidecar / waypoint), Linkerd HTTPRoute + hatalı backend'ler, k6]
meshes: [istio-sidecar, istio-ambient, istio-ambient-l7, linkerd]
outputs: [observed_error_rate, p50_ms, p95_ms, method]
pass_criteria: Gözlenen hata oranı %10 ± 3 puan ve p95 >= 200 ms
