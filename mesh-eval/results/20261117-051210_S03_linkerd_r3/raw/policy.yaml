---
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata: { name: gateway, namespace: shop }
spec:
  podSelector: { matchLabels: { app: gateway } }
  port: http
  proxyProtocol: HTTP/1
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata: { name: gateway-clients, namespace: shop }
spec: { identities: ["k6.loadgen.serviceaccount.identity.linkerd.cluster.local","ingress-nginx.ingress-nginx.serviceaccount.identity.linkerd.cluster.local","gateway.shop.serviceaccount.identity.linkerd.cluster.local"] }
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata: { name: gateway-authz, namespace: shop }
spec:
  targetRef: { group: policy.linkerd.io, kind: Server, name: gateway }
  requiredAuthenticationRefs: [{ group: policy.linkerd.io, kind: MeshTLSAuthentication, name: gateway-clients }]
---
