# Linkerd: Server'a HTTPRoute tanımlanınca kubelet sağlık kontrolleri (/ready) artık otomatik yetkili
# değildir -> probe yolları için ayrı route + node ağından kimliksiz erişim izni gerekir.
apiVersion: policy.linkerd.io/v1beta3
kind: HTTPRoute
metadata: { name: order-probes, namespace: shop }
spec:
  parentRefs: [{ group: policy.linkerd.io, kind: Server, name: order }]
  rules: [{ matches: [{ path: { type: Exact, value: /ready }, method: GET }, { path: { type: Exact, value: /health }, method: GET }] }]
---
apiVersion: policy.linkerd.io/v1alpha1
kind: NetworkAuthentication
metadata: { name: kubelet, namespace: shop }
spec: { networks: [{ cidr: 0.0.0.0/0 }] }
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata: { name: order-probes, namespace: shop }
spec:
  targetRef: { group: policy.linkerd.io, kind: HTTPRoute, name: order-probes }
  requiredAuthenticationRefs: [{ group: policy.linkerd.io, kind: NetworkAuthentication, name: kubelet }]
