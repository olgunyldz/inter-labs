# DMZ B: edge LB'nin arkasındaki iki DMZ cluster'ından biri (host'a doğrudan açık değil)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dmz-b
networking:
  podSubnet: 10.12.0.0/16
  serviceSubnet: 10.13.0.0/16
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
      lab.zone: dmz
