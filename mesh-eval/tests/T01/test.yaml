id: T01
name: Kademeli yayın — ağırlıklı yönlendirme, başlık bazlı yönlendirme, trafik yansıtma
category: trafik
purpose: >
  Yeni sürümü (canary) kullanıcıların küçük bir kısmına açabilmek, belirli istekleri (başlık) yeni
  sürüme yönlendirebilmek ve gerçek trafiği yeni sürüme kopyalayıp (mirroring) cevabı kullanmadan
  deneyebilmek. Tüm mesh'lerde aynı standart (Gateway API HTTPRoute, GAMMA) kullanılır.
method: >
  catalog'un v2 sürümü ayrı deployment olarak açılır (catalog-v1 / catalog-v2 servisleri).
  (1) %90/%10 ağırlık: 400 istekte v2 oranı ölçülür. (2) "x-canary: true" başlıklı istekler %100 v2.
  (3) Tüm trafik v1'e giderken v2'ye yansıtılır: cevaplar v1, v2'ye gelen istek sayısı ölçülür.
  Mesh yoksa yalnızca replika sayısıyla orantılı dağılım mümkündür (referans).
components: [Gateway API HTTPRoute (GAMMA), Istio (sidecar / waypoint), Linkerd, chainsvc v1/v2]
meshes: [all]
outputs: [weighted.v2_share, header.v2_share, mirror.supported, mirror.v2_received]
pass_criteria: Ağırlıklı yönlendirmede v2 payı %10 ± 5 puan, başlıklı isteklerin tamamı v2
