# Linkerd: default-inbound-policy=all-authenticated proxy'nin admin portunu (4191, /metrics) da kapsar.
# Prometheus agent mesh dışında olduğu için, yalnızca agent'ın çalıştığı node'un pod ağına izin verilir.
# __NS__ ve __CIDR__ meval tarafından doldurulur.
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata: { name: linkerd-admin, namespace: __NS__ }
spec:
  podSelector: {}
  port: linkerd-admin
  proxyProtocol: HTTP/1
---
apiVersion: policy.linkerd.io/v1alpha1
kind: NetworkAuthentication
metadata: { name: prometheus-agent, namespace: __NS__ }
spec:
  networks: [{ cidr: __CIDR__ }]
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata: { name: linkerd-admin-scrape, namespace: __NS__ }
spec:
  targetRef: { group: policy.linkerd.io, kind: Server, name: linkerd-admin }
  requiredAuthenticationRefs:
    - { group: policy.linkerd.io, kind: NetworkAuthentication, name: prometheus-agent }
