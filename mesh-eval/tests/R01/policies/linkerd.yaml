apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pricing
  namespace: shop
  annotations:
    timeout.linkerd.io/request: 500ms
    retry.linkerd.io/http: 5xx
    retry.linkerd.io/limit: "2"
    retry.linkerd.io/timeout: 150ms
spec:
  parentRefs: [{ group: core, kind: Service, name: pricing, port: 9090 }]
  rules: [{ backendRefs: [{ name: pricing, port: 9090 }] }]
