# waypoint uygular (Service hedefli)
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: order-endpoints, namespace: shop }
spec:
  targetRefs: [{ kind: Service, group: "", name: order }]
  action: ALLOW
  rules:
    - from: [{ source: { principals: ["cluster.local/ns/shop/sa/gateway"] } }]
      to: [{ operation: { methods: ["GET"], paths: ["/", "/api/*"] } }]
