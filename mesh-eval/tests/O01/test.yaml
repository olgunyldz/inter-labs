id: O01
name: Gözlemlenebilirlik — hazır metrikler, doğruluk, dağıtık izleme, erişim logu
category: gözlem
purpose: >
  Mesh'in uygulama koduna dokunmadan ne kadar görünürlük sağladığını ölçmek: her servis için "altın
  metrikler" (istek hızı, başarı oranı, gecikme), mesh'in ölçtüğü gecikmenin doğruluğu (k6'ya göre),
  uçtan uca trace (Tempo) ve erişim logu.
method: >
  100 RPS yük altında: (1) 8 servisin kaçı için mesh L7 metrikleri (istek/başarı/gecikme histogramı)
  veya yalnızca L4 (TCP) metrikleri var; (2) gateway'de mesh'in p99'u / k6 p99 oranı; (3) tracing
  geçici olarak açılır (Istio Telemetry API %100 örnekleme -> Tempo; Linkerd linkerd-jaeger eklentisi
  -> Tempo; uygulama B3 başlıklarını taşır) ve bir trace'teki span / servis sayısı ölçülür;
  (4) erişim logu açılıp proxy logunda istek satırı aranır.
components: [mesh metrikleri, Prometheus, Tempo (mgmt), Grafana datasource proxy, Istio Telemetry API, linkerd-jaeger]
meshes: [istio-sidecar, istio-ambient, istio-ambient-l7, linkerd]
outputs: [services_l7_metrics, services_l4_metrics, latency_accuracy_ratio, trace.spans, trace.services, trace.mesh_spans, access_log]
pass_criteria: Tüm servisler için en az L4 metrik var ve trace Tempo'da bulunur
