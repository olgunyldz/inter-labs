id: T02
name: Protokol desteği — gRPC yük dağılımı, server-first TCP, veri tabanı trafiği
category: trafik
purpose: >
  Prod'daki protokollerin mesh'ten sorunsuz geçtiğini göstermek: (1) gRPC / HTTP2'de istek bazlı yük
  dağılımı (kube-proxy bağlantı bazlı dağıtır, uzun ömürlü bağlantı tek pod'a yapışır);
  (2) bağlantıyı önce sunucunun konuştuğu protokoller (SMTP, MySQL benzeri; Oracle/MSSQL/Kafka gibi
  TCP protokolleri için gösterge) — protokol algılama gecikmesi; (3) Redis / Postgres TCP trafiği.
method: >
  (1) fraud 3 replikaya çıkarılır; payment'a 300 istek atılır (payment -> fraud gRPC, kalıcı bağlantı);
  cevaplardaki fraud pod IP'lerinin dağılımı ölçülür. (2) banner servisine (bağlanınca sunucu yazar)
  protokol ipucu olan (appProtocol: tcp) ve olmayan port üzerinden bağlanılıp ilk baytın gelme süresi
  ölçülür. (3) data cluster'ındaki Redis'e PING, Postgres'e TCP bağlantısı.
components: [chainsvc gRPC, socat (banner), data cluster Redis/Postgres, mesh protokol algılama]
meshes: [all]
outputs: [grpc.pods_used, grpc.max_share, banner.hint_ms, banner.nohint_ms, redis_ok, postgres_ok]
pass_criteria: Redis/Postgres erişimi çalışır, protokol ipuçlu server-first bağlantı < 1 sn
