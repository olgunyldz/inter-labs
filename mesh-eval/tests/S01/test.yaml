id: S01
name: mTLS zorunluluğu ve hat üzerinde şifreleme
category: güvenlik
purpose: >
  Servisler arası trafiğin (1) mesh dışından şifresiz erişime kapalı olduğunu ve (2) ağ üzerinde
  gerçekten şifreli aktığını kanıtlamak. PCI DSS segmentasyon ve "iletimde şifreleme" kanıtı.
method: >
  (1) Mesh dışı bir namespace'teki pod order servisine düz HTTP ile bağlanmayı dener.
  (2) Servis node'unda host ağında çalışan tcpdump, probe-gateway -> order isteklerine eklenen
  benzersiz bir işaret metnini (X-Meval-Marker başlığı) ağ paketlerinde arar. İşaret görünüyorsa
  trafik şifresizdir.
components: [tcpdump (netshoot, hostNetwork), mesh proxy'leri, PeerAuthentication / default-inbound-policy]
meshes: [all]
outputs: [plaintext_from_outside, marker_packets]
pass_criteria: Mesh dışı düz erişim reddedilir ve işaret metni ağda görünmez
