# Mesh yok: NetworkPolicy ile probe-rogue -> order engeli (L3/L4, etiket bazlı)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: p07-deny-rogue, namespace: shop }
spec:
  podSelector: { matchLabels: { app: order } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchExpressions: [{ key: app, operator: NotIn, values: [probe-rogue] }] } }]
