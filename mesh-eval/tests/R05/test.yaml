id: R05
name: Yük altında kesintisiz mesh güncellemesi
category: dayanıklılık
purpose: >
  Mesh sürüm güncellemesinin (yılda birkaç kez zorunlu) iş trafiğini kesip kesmediğini, ne kadar
  sürdüğünü ve hangi adımları gerektirdiğini ölçmek. Sidecar ile ambient arasındaki en büyük
  operasyonel fark beklenen kalem.
method: >
  Mesh bir önceki sürümle (Istio 1.30.x / Linkerd bir önceki edge) yeniden kurulur, uygulama mesh'e alınır.
  150 RPS sabit yük sürerken hedef sürüme güncellenir:
  sidecar: revizyonlu (canary) kontrol düzlemi + varsayılan etiketin taşınması + tüm deployment'ların
  sırayla yeniden başlatılması; ambient: helm ile yerinde güncelleme (base, istiod, istio-cni, ztunnel);
  linkerd: linkerd upgrade + deployment'ların yeniden başlatılması. Güncelleme süresi, adım sayısı,
  yeniden başlatılan pod sayısı ve başarısız istekler ölçülür.
components: [helm / istioctl / linkerd CLI, k6, tüm veri düzlemi]
meshes: [istio-sidecar, istio-ambient, istio-ambient-l7, linkerd]
outputs: [upgrade_duration_s, steps, restarted_pods, failed_requests, error_rate]
pass_criteria: Güncelleme sırasında hata oranı < %1 ve sonunda tüm proxy'ler yeni sürümde
