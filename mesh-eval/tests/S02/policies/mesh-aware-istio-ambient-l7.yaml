# Ambient'e özel ek: kubelet sağlık kontrolleri ambient'te 169.254.7.127 kaynak adresinden gelir (SNAT).
# Ayrıca ztunnel'ler arası HBONE trafiği hedef pod'un 15008 portuna gelir.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-ambient-probes, namespace: shop }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress: [{ from: [{ ipBlock: { cidr: 169.254.7.127/32 } }] }]
---
# waypoint: tüm servislerin trafiği waypoint'ten geçer -> hedeflere waypoint'ten erişim izni
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-from-waypoint, namespace: shop }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress: [{ from: [{ podSelector: { matchLabels: { gateway.networking.k8s.io/gateway-name: waypoint } } }] }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-to-waypoint, namespace: shop }
spec:
  podSelector: { matchLabels: { gateway.networking.k8s.io/gateway-name: waypoint } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: loadgen } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
