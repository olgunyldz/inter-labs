# Hangi cluster/pod'un cevap verdiğini JSON olarak döner
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-nginx
data:
  default.conf.template: |
    server {
      listen 8080;
      location = /healthz { access_log off; return 200 "ok\n"; }
      location / {
        default_type application/json;
        return 200 '{"cluster":"${CLUSTER_NAME}","pod":"$hostname","host":"$host","client":"$remote_addr","xff":"$http_x_forwarded_for"}\n';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  replicas: 2
  selector:
    matchLabels: { app: demo-app }
  template:
    metadata:
      labels: { app: demo-app }
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          env:
            - { name: CLUSTER_NAME, value: unknown }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - { name: templates, mountPath: /etc/nginx/templates }
      volumes:
        - name: templates
          configMap: { name: demo-app-nginx }
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
spec:
  selector: { app: demo-app }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-app
spec:
  ingressClassName: nginx
  rules:
    - host: app.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: demo-app, port: { name: http } }
