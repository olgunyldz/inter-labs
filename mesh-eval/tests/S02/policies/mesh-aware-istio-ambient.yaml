# Ambient'e özel ek: kubelet sağlık kontrolleri ambient'te 169.254.7.127 kaynak adresinden gelir (SNAT).
# Ayrıca ztunnel'ler arası HBONE trafiği hedef pod'un 15008 portuna gelir.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-ambient-probes, namespace: shop }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress: [{ from: [{ ipBlock: { cidr: 169.254.7.127/32 } }] }]
