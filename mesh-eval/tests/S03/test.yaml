id: S03
name: Servisler arası whitelisting — kimlik bazlı (mesh yetki politikası)
category: güvenlik
purpose: >
  Servisler arası erişimi IP/etiket yerine kriptografik kimlikle (ServiceAccount, mTLS sertifikası)
  kısıtlamak: varsayılan ret + her servis için izinli çağıranlar listesi. NetworkPolicy'den (S02) farkı:
  etiket taklidi işe yaramaz.
method: >
  Kenar listesi (lib/policy.sh, AUTHZ_EDGES) mesh'in politika diline çevrilip uygulanır:
  Istio AuthorizationPolicy (sidecar/ambient: pod seçici; ambient+waypoint: Service hedefli),
  Linkerd Server + MeshTLSAuthentication + AuthorizationPolicy. İzin/ret matrisi ve kimlik taklidi
  (impostor: etiket gateway, kimlik rogue) denenir.
components: [mesh yetki politikası, mTLS kimlikleri, netshoot istemcileri]
meshes: [istio-sidecar, istio-ambient, istio-ambient-l7, linkerd]
outputs: [policy_objects, matris kontrolleri, impostor_access]
pass_criteria: İzin/ret matrisinin tamamı beklendiği gibi, kimlik taklidi reddedilir, pod'lar sağlıklı
