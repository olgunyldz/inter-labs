id: S04
name: Endpoint bazlı erişim kısıtı (L7 — path / method)
category: güvenlik
purpose: >
  Bir servisin yalnızca belirli endpoint'lerinin, belirli kimliklere ve HTTP metotlarına açık
  olmasını sağlamak (ör. /admin kapalı, yalnızca GET). Mesh içinde endpoint bazlı whitelisting.
method: >
  order servisi için kural: yalnızca gateway kimliği, yalnızca GET, yalnızca "/" ve "/api/*".
  /admin, POST, DELETE ve başka kimlik reddedilmeli. Önce kural tek başına uygulanır; kubelet sağlık
  kontrollerini bozuyorsa (bulgu) gerekli ek kural eklenir.
  Ambient L4 (waypoint'siz) profilde L7 kural uygulanamaz; gözlenen davranış kaydedilir.
components: [Istio AuthorizationPolicy (sidecar / waypoint), Linkerd HTTPRoute + AuthorizationPolicy]
meshes: [istio-sidecar, istio-ambient, istio-ambient-l7, linkerd]
outputs: [matris kontrolleri, probe_fix_needed]
pass_criteria: İzinli endpoint'ler açık, diğerleri reddedilir, zincir çalışır
