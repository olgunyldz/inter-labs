apiVersion: networking.istio.io/v1
kind: VirtualService
metadata: { name: pricing, namespace: shop }
spec:
  hosts: [pricing.shop.svc.cluster.local]
  http:
    - route: [{ destination: { host: pricing.shop.svc.cluster.local } }]
      timeout: 500ms
      retries: { attempts: 2, perTryTimeout: 150ms, retryOn: "5xx,reset,connect-failure" }
