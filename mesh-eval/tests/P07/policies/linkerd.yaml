# Linkerd: yalnızca izin listesi (allow) modeli vardır. order portu için Server tanımlanır ve
# yalnızca gateway/probe-gateway kimliğine izin verilir -> rogue reddedilir.
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata: { name: p07-order, namespace: shop }
spec:
  podSelector: { matchLabels: { app: order } }
  port: http
  proxyProtocol: HTTP/1
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata: { name: p07-gateway, namespace: shop }
spec:
  identities: ["gateway.shop.serviceaccount.identity.linkerd.cluster.local"]
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata: { name: p07-order-allow, namespace: shop }
spec:
  targetRef: { group: policy.linkerd.io, kind: Server, name: p07-order }
  requiredAuthenticationRefs: [{ group: policy.linkerd.io, kind: MeshTLSAuthentication, name: p07-gateway }]
