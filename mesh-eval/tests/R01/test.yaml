id: R01
name: Timeout, retry ve outlier detection (circuit breaking)
category: dayanıklılık
purpose: >
  (A) Bir alt servis yavaşladığında mesh'in timeout + retry politikasının uçtan uca gecikmeyi
  sınırladığını ve retry'ların yükü ne kadar artırdığını (amplifikasyon) ölçmek.
  (B) Hatalı bir replika (sürekli 503) devredeyken outlier detection'ın onu devreden çıkardığını göstermek.
method: >
  100 RPS sabit yük. (A) pricing isteklerinin %20'si 1 sn gecikir; önce politikasız, sonra
  inventory -> pricing için timeout 500 ms / deneme başına 150 ms / 2 retry. pricing'e gelen istek
  sayısı / gateway istek sayısı = amplifikasyon. (B) pricing'e sürekli 503 dönen 1 replika eklenir
  (2 sağlam + 1 hatalı); önce politikasız, sonra outlier detection (Istio DestinationRule /
  Linkerd failure accrual) ile hata oranı ölçülür.
components: [Istio VirtualService + DestinationRule (sidecar / waypoint), Linkerd HTTPRoute retry/timeout + failure accrual, chainsvc hata enjeksiyonu]
meshes: [all]
outputs: [A.none.p99_ms, A.policy.p99_ms, A.amplification, B.none.error_rate, B.policy.error_rate]
pass_criteria: Politikayla p99 < 1000 ms ve outlier detection ile hata oranı yarıdan fazla düşer
