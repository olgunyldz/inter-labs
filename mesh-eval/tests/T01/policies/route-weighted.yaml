apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: catalog-canary, namespace: shop }
spec:
  parentRefs: [{ group: "", kind: Service, name: catalog, port: 9090 }]
  rules:
    - matches: [{ headers: [{ name: x-canary, value: "true" }] }]
      backendRefs: [{ name: catalog-v2, port: 9090 }]
    - backendRefs:
        - { name: catalog-v1, port: 9090, weight: 90 }
        - { name: catalog-v2, port: 9090, weight: 10 }
